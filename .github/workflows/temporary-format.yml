name: temporary-readme-format
on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - '.github/workflows/temporary-format.yml'
permissions:
  contents: write
jobs:
  format:
    if: contains(github.event.head_commit.message, '[format-pass]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write README.md
      - name: Commit formatting changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "[format-pass] Format README"
          git push
