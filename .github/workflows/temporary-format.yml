name: temporary-format-pass
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'docs/**'
      - 'README.md'
      - 'package.json'
      - 'package-lock.json'
      - 'integrations/**'
      - '.github/workflows/temporary-format.yml'
permissions:
  contents: write
jobs:
  format:
    if: contains(github.event.head_commit.message, '[format-pass]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format changed project areas
        run: >-
          npx prettier --write
          "src/**/*.ts"
          "tests/**/*.ts"
          "docs/**/*.md"
          "integrations/vscode/**/*"
          "integrations/vscode/.vscode/launch.json"
          README.md package.json package-lock.json
      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests docs integrations README.md package.json package-lock.json
          git commit -m "[format-pass] Apply Prettier formatting"
          git push
