name: temporary-format
on: push
permissions:
  contents: write
jobs:
  format:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[format-pass]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/commands/assurance.ts
      - name: Commit formatted file
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/commands/assurance.ts
          git commit -m "Format assurance command"
          git push origin HEAD:main
